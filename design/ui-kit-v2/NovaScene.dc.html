<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="nova-theme.css"></helmet>
<div style="position:absolute;inset:0;overflow:hidden;background:#06162e">
  <img src="{{ src }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,17,40,.05) 20%,rgba(4,17,40,.10) 50%,rgba(4,17,40,.38)),linear-gradient(90deg,rgba(4,17,40,.34),rgba(4,17,40,0) 60%)"></div>
  <sc-if value="{{ dim }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:var(--nova-overlay);backdrop-filter:blur(3px)"></div>
  </sc-if>
  <div style="position:absolute;left:0;right:0;top:0;height:46px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font:600 15px var(--nova-font);color:#fff">
    <span>9:41</span>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="display:flex;align-items:flex-end;gap:2px"><i style="width:3px;height:5px;background:#fff;border-radius:1px"></i><i style="width:3px;height:7px;background:#fff;border-radius:1px"></i><i style="width:3px;height:9px;background:#fff;border-radius:1px"></i><i style="width:3px;height:11px;background:#fff;border-radius:1px"></i></div>
      <div style="width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;padding:1px;box-sizing:content-box"><div style="width:70%;height:100%;background:#fff;border-radius:1px"></div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;bgImage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { src: this.props.bgImage || 'assets/nova-city.png', dim: !!this.props.dim };
  }
}
</script>
</body>
</html>
